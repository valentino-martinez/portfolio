# Builds the React site in react/ and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings -> Pages -> Source -> "GitHub
# Actions". Nothing else; this workflow does the rest on every push
# to main.

name: Deploy to Pages

on:
  push:
    branches: [main]
  # So you can re-publish without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - run: npm ci

      # tsc runs as part of build, so a type error fails the deploy
      # rather than shipping quietly.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
